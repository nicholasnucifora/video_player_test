<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disconnect Player</title>
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --surface: #141414;
      --surface-2: #1b1b1c;
      --surface-3: #232325;
      --line: #2d2d30;
      --muted: #9a9aa0;
      --muted-2: #6f6f76;
      --text: #f4f4f5;
      --accent: #7dd3fc;
      --accent-2: #f3c969;
      --danger: #ff6b6b;
      --ok: #73d49b;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior-y: none;
    }

    button, select { font: inherit; }
    button { appearance: none; }
    a { color: inherit; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(16px, 3vw, 32px);
      background: rgba(11, 11, 12, 0.86);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #090909;
    }

    .topbar-status {
      color: var(--muted);
      font-size: 0.86rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .watch-shell {
      background: #050505;
      border-bottom: 1px solid var(--line);
    }

    .watch-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      min-height: min(72vh, 780px);
    }

    .watch-grid.panel-open {
      grid-template-columns: minmax(0, 1fr) minmax(360px, 460px);
    }

    .video-column {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .player-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 260px;
      background: #000;
      position: relative;
    }

    .youtube-slot,
    .youtube-slot iframe,
    #youtubePlayer,
    #youtubePlayer iframe,
    .player-frame > iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .player-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: #000;
      pointer-events: none;
    }

    .player-placeholder.hidden { display: none; }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: rgba(255, 255, 255, 0.72);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .player-message {
      max-width: 320px;
      padding: 0 18px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
      font-weight: 650;
    }

    .app-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px clamp(12px, 2vw, 18px);
      background: linear-gradient(180deg, #151515, #101010);
      border-top: 1px solid #202020;
      min-height: 66px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .tool-button,
    .icon-button,
    .speed-button,
    .load-more-btn,
    .resume-button {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.16s, border-color 0.16s, transform 0.16s, color 0.16s;
    }

    .tool-button,
    .resume-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      font-weight: 650;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .tool-button svg,
    .icon-button svg,
    .resume-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .tool-button:hover,
    .icon-button:hover,
    .speed-button:hover,
    .load-more-btn:hover,
    .resume-button:hover {
      background: var(--surface-3);
      border-color: #414146;
    }

    .tool-button:active,
    .icon-button:active,
    .speed-button:active,
    .resume-button:active {
      transform: translateY(1px);
    }

    .tool-button.active,
    .speed-button.active {
      border-color: rgba(125, 211, 252, 0.74);
      color: #e9f8ff;
      background: rgba(125, 211, 252, 0.14);
    }

    .save-state {
      min-width: 0;
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .feature-panel {
      display: none;
      min-width: 0;
      background: var(--surface);
      border-left: 1px solid var(--line);
      flex-direction: column;
      max-height: min(72vh, 780px);
    }

    .watch-grid.panel-open .feature-panel { display: flex; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      min-height: 62px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 760;
    }

    .panel-body {
      overflow: auto;
      padding: 8px 0 18px;
    }

    .panel-body::-webkit-scrollbar,
    .comments-section::-webkit-scrollbar {
      width: 8px;
    }

    .panel-body::-webkit-scrollbar-thumb,
    .comments-section::-webkit-scrollbar-thumb {
      background: #3a3a3d;
      border-radius: 999px;
    }

    .chapter-item {
      width: 100%;
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 12px 16px;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: background 0.16s, border-color 0.16s;
    }

    .chapter-item:hover { background: #1e1e20; }
    .chapter-item.active {
      border-left-color: var(--accent);
      background: rgba(125, 211, 252, 0.1);
    }

    .chapter-thumb {
      width: 128px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      object-fit: cover;
      background: #252525;
    }

    .chapter-label {
      display: block;
      font-size: 0.96rem;
      line-height: 1.36;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .chapter-time {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
    }

    .settings-panel {
      padding: 12px 16px 22px;
    }

    .settings-block {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .settings-block:last-child { border-bottom: 0; }

    .settings-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 720;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .channel-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .channel-mini img {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      object-fit: cover;
      background: #2a2a2a;
      flex: 0 0 auto;
    }

    .channel-mini strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .channel-mini span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .speed-button {
      min-height: 38px;
      font-weight: 700;
    }

    .settings-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .clear-speed {
      width: 100%;
      min-height: 40px;
      margin-top: 12px;
      color: #ffd6d6;
    }

    .mobile-chapter-strip {
      display: none;
      padding: 12px clamp(12px, 3vw, 18px) 14px;
      gap: 10px;
      overflow-x: auto;
      background: #101010;
      border-top: 1px solid #202020;
      scrollbar-width: none;
    }

    .mobile-chapter-strip::-webkit-scrollbar { display: none; }

    .chapter-chip {
      flex: 0 0 148px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .chapter-chip img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #252525;
    }

    .chapter-chip span {
      display: block;
      padding: 7px 8px 2px;
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .chapter-chip small {
      display: block;
      padding: 0 8px 8px;
      color: var(--muted);
      font-size: 0.74rem;
      font-variant-numeric: tabular-nums;
    }

    .chapter-chip.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.42);
    }

    .below-player {
      max-width: 1120px;
      padding: 28px clamp(16px, 4vw, 44px) 52px;
    }

    .video-info {
      margin-bottom: 28px;
    }

    .video-title {
      font-size: clamp(1.32rem, 2.2vw, 2.15rem);
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: 0;
      margin-bottom: 16px;
    }

    .channel-row {
      display: none;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .channel-row img {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      object-fit: cover;
      background: #2a2a2a;
    }

    .channel-name {
      font-weight: 750;
    }

    .description-box {
      max-width: 940px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
    }

    .desc-preview {
      color: #d7d7d9;
      line-height: 1.55;
      font-size: 0.98rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .description-box.expanded .desc-preview {
      -webkit-line-clamp: unset;
      white-space: pre-wrap;
    }

    .desc-toggle {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .desc-preview a,
    .comment-main .text a {
      color: #a7d9ff;
      text-decoration: none;
    }

    .desc-preview a:hover,
    .comment-main .text a:hover {
      text-decoration: underline;
    }

    .comments-section h2 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .comment-thread {
      position: relative;
      padding-left: 0;
    }

    .comment-main {
      display: flex;
      gap: 14px;
      padding: 14px 0;
    }

    .comment-main img {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      object-fit: cover;
      background: #2a2a2a;
      flex: 0 0 auto;
    }

    .comment-body {
      flex: 1;
      min-width: 0;
    }

    .author {
      color: #f1f1f1;
      font-size: 0.98rem;
      font-weight: 750;
      margin-bottom: 4px;
    }

    .text {
      color: #d2d2d5;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted-2);
      font-size: 0.85rem;
      margin-top: 7px;
    }

    .text.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .text.truncated.expanded { -webkit-line-clamp: unset; }

    .read-more-btn {
      border: 0;
      background: none;
      color: var(--accent);
      cursor: pointer;
      font-weight: 750;
      padding: 4px 0;
      margin-top: 3px;
    }

    .thread-stem {
      display: none;
      position: absolute;
      left: 4px;
      top: 56px;
      width: 38px;
      cursor: pointer;
      z-index: 1;
    }

    .thread-stem::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #343438;
      transition: background 0.15s;
    }

    .comment-thread.has-replies .thread-stem,
    .comment-thread.has-replies-open .thread-stem {
      display: block;
    }

    .comment-thread.thread-hover .thread-stem::after,
    .comment-thread.thread-hover .replies-collapse-line::after {
      background: #78787f;
    }

    .comment-thread.thread-hover .replies-toggle-top::after,
    .comment-thread.thread-hover .reply-wrapper::after,
    .comment-thread.thread-hover .replies-toggle-bottom::after {
      border-color: #78787f;
    }

    .replies-toggle-top {
      position: relative;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 780;
      cursor: pointer;
      padding: 8px 12px 8px 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      margin-left: 24px;
      border-radius: 18px;
    }

    .replies-toggle-top::after {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 14px;
      height: 16px;
      border-left: 2px solid #343438;
      border-bottom: 2px solid #343438;
      border-radius: 0 0 0 12px;
    }

    .replies-toggle-top:hover,
    .replies-toggle-bottom:hover,
    .subreply-toggle:hover,
    .subreply-toggle-bottom:hover {
      background: rgba(125, 211, 252, 0.1);
    }

    .replies-container {
      margin-left: 24px;
      display: none;
      position: relative;
    }

    .replies-container.show { display: block; }

    .replies-collapse-line {
      position: absolute;
      left: -18px;
      top: 0;
      bottom: 22px;
      width: 38px;
      cursor: pointer;
      z-index: 2;
    }

    .replies-collapse-line::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #343438;
      border-radius: 1px;
      transition: background 0.15s;
    }

    .reply-wrapper {
      position: relative;
      padding-left: 22px;
      min-height: 32px;
    }

    .reply-wrapper::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 18px;
      border-left: 2px solid #343438;
      border-bottom: 2px solid #343438;
      border-radius: 0 0 0 12px;
    }

    .reply-wrapper .comment-main { padding: 4px 0 8px; }
    .reply-wrapper .comment-main img { width: 34px; height: 34px; }

    .reply-wrapper .subreply-stem {
      display: none;
      position: absolute;
      left: 39px;
      top: 38px;
      width: 20px;
      cursor: pointer;
      z-index: 1;
    }

    .reply-wrapper .subreply-stem::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #343438;
      transition: background 0.15s;
    }

    .reply-wrapper.has-subreplies .subreply-stem,
    .reply-wrapper.has-subreplies-open .subreply-stem {
      display: block;
    }

    .reply-wrapper.subreply-hover .subreply-stem::after,
    .reply-wrapper.subreply-hover .subreplies-collapse-line::after {
      background: #78787f;
    }

    .reply-wrapper.subreply-hover .subreply-toggle::after,
    .reply-wrapper.subreply-hover .subreply-toggle-bottom::after,
    .reply-wrapper.subreply-hover .subreply-item::after {
      border-color: #78787f;
    }

    .replies-toggle-bottom,
    .subreply-toggle,
    .subreply-toggle-bottom {
      position: relative;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 0.96rem;
      font-weight: 780;
      cursor: pointer;
      display: flex;
      align-items: center;
      border-radius: 18px;
    }

    .replies-toggle-bottom {
      padding: 4px 12px 8px 22px;
    }

    .replies-toggle-bottom::after,
    .subreply-toggle::after,
    .subreply-toggle-bottom::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 14px;
      border-left: 2px solid #343438;
      border-bottom: 2px solid #343438;
      border-radius: 0 0 0 12px;
    }

    .subreply-toggle {
      margin-left: 18px;
      padding: 4px 12px 4px 22px;
    }

    .subreply-toggle-bottom {
      padding: 4px 12px 4px 22px;
    }

    .subreplies-container {
      margin-left: 18px;
      display: none;
      position: relative;
    }

    .subreplies-container.show { display: block; }

    .subreplies-collapse-line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 20px;
      width: 20px;
      cursor: pointer;
      z-index: 2;
    }

    .subreplies-collapse-line::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #343438;
      border-radius: 1px;
      transition: background 0.15s;
    }

    .subreply-item {
      position: relative;
      padding-left: 22px;
    }

    .subreply-item::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 16px;
      border-left: 2px solid #343438;
      border-bottom: 2px solid #343438;
      border-radius: 0 0 0 12px;
    }

    .subreply-item .comment-main { padding: 4px 0 6px; }
    .subreply-item .comment-main img { width: 30px; height: 30px; }

    .panel-thread {
      padding: 0 16px;
    }

    .panel-thread .comment-main img { width: 34px; height: 34px; }
    .panel-thread .author { font-size: 0.9rem; }
    .panel-thread .text { font-size: 0.9rem; }
    .panel-thread .meta { font-size: 0.78rem; }
    .panel-thread.comment-thread > .thread-stem { left: 16px; top: 48px; }

    .load-more-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 16px;
      font-weight: 730;
    }

    .load-more-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      display: grid;
      gap: 8px;
      max-width: min(360px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast-item {
      background: rgba(24, 24, 25, 0.95);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 13px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .empty-state {
      padding: 22px 16px;
      color: var(--muted);
      line-height: 1.45;
    }

    .watch-shell:fullscreen {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .watch-shell:fullscreen .watch-grid {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .watch-shell:fullscreen .feature-panel {
      max-height: none;
    }

    .watch-shell:fullscreen .video-column {
      min-height: 0;
    }

    .watch-shell:fullscreen .player-frame {
      flex: 1;
      min-height: 0;
      aspect-ratio: auto;
    }

    .watch-shell:fullscreen .mobile-chapter-strip {
      max-height: 150px;
    }

    @media (max-width: 1040px) {
      .watch-grid.panel-open {
        grid-template-columns: minmax(0, 1fr);
      }

      .feature-panel {
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: 55vh;
      }
    }

    @media (max-width: 760px) {
      .topbar { position: static; }
      .topbar-status { display: none; }
      .watch-grid { min-height: 0; }
      .player-frame { min-height: 0; }
      .app-toolbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }
      .toolbar-group { width: 100%; }
      .toolbar-group.primary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .tool-button {
        justify-content: center;
        padding: 0 8px;
        min-width: 0;
      }
      .tool-button span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar-group.secondary {
        justify-content: space-between;
        flex-wrap: nowrap;
      }
      .save-state { flex: 1; }
      .mobile-chapter-strip.has-chapters { display: flex; }
      .below-player { padding-top: 22px; }
      .video-title { font-size: 1.22rem; }
      .description-box { padding: 12px; }
      .comment-main { gap: 12px; }
      .comment-main img { width: 38px; height: 38px; }
      .thread-stem { top: 50px; }
      .chapter-item {
        grid-template-columns: 112px minmax(0, 1fr);
        padding: 12px;
      }
      .chapter-thumb { width: 112px; }
      .speed-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand-link" href="/" aria-label="Back to Disconnect">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span>Disconnect</span>
    </a>
    <div class="topbar-status" id="topbarStatus">Loading video...</div>
  </header>

  <main>
    <section class="watch-shell" id="watchShell" aria-label="Video player">
      <div class="watch-grid" id="watchGrid">
        <div class="video-column">
          <div class="player-frame" id="playerFrame">
            <div class="youtube-slot" id="youtubePlayer"></div>
            <div class="player-placeholder" id="playerPlaceholder"><div class="spinner" aria-label="Loading"></div></div>
          </div>

          <div class="app-toolbar" aria-label="Video tools">
            <div class="toolbar-group primary">
              <button class="tool-button" id="chaptersBtn" type="button" title="Open chapters">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h3v3H4V6zm5 .5h11v2H9v-2zM4 11h3v3H4v-3zm5 .5h11v2H9v-2zM4 16h3v3H4v-3zm5 .5h11v2H9v-2z"/></svg>
                <span>Chapters</span>
              </button>
              <button class="tool-button" id="commentsBtn" type="button" title="Open comments panel">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 3H4a2 2 0 0 0-2 2v16l4-4h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
                <span>Comments</span>
              </button>
              <button class="tool-button" id="settingsBtn" type="button" title="Channel playback settings">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-2.6-1.5L14 2h-4l-.4 2.9A7.7 7.7 0 0 0 7 6.4l-2.5-1-2 3.5 2.1 1.6c-.1.5-.1 1-.1 1.5s0 1 .1 1.5l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 2.6 1.5L10 22h4l.4-2.9a7.7 7.7 0 0 0 2.6-1.5l2.5 1 2-3.5-2.1-1.6zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
                <span>Channel</span>
              </button>
            </div>

            <div class="toolbar-group secondary">
              <button class="resume-button" id="resumeBtn" type="button" title="Resume saved position" hidden>
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                <span id="resumeLabel">Resume</span>
              </button>
              <button class="icon-button" id="saveBtn" type="button" title="Save progress" aria-label="Save progress">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zM12 19a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM6 8V5h9v3H6z"/></svg>
              </button>
              <button class="icon-button" id="finishBtn" type="button" title="Mark finished" aria-label="Mark finished">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
              </button>
              <button class="icon-button" id="fullscreenBtn" type="button" title="Fullscreen layout" aria-label="Fullscreen layout">
                <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5h6v2H7v4H5V5zm12 2h-4V5h6v6h-2V7zM7 17h4v2H5v-6h2v4zm10-4h2v6h-6v-2h4v-4z"/></svg>
              </button>
              <div class="save-state" id="saveState">No saved progress</div>
            </div>
          </div>

          <div class="mobile-chapter-strip" id="mobileChapterStrip" aria-label="Video chapters"></div>
        </div>

        <aside class="feature-panel" id="featurePanel" aria-live="polite">
          <div class="panel-header">
            <h2 class="panel-title" id="panelTitle">Chapters</h2>
            <button class="icon-button" id="closePanelBtn" type="button" title="Close panel" aria-label="Close panel">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m18.3 5.7-1.4-1.4L12 9.2 7.1 4.3 5.7 5.7l4.9 4.9-4.9 4.9 1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9 4.9-4.9z"/></svg>
            </button>
          </div>
          <div class="panel-body" id="panelBody"></div>
        </aside>
      </div>
    </section>

    <section class="below-player">
      <div class="video-info" id="videoInfo">
        <h1 class="video-title" id="videoTitle">Loading...</h1>
        <div class="channel-row" id="channelRow">
          <img id="channelAvatar" src="" alt="Channel avatar" />
          <div>
            <div class="channel-name" id="channelName"></div>
          </div>
        </div>
        <div class="description-box" id="descBox" tabindex="0" role="button" aria-expanded="false">
          <div class="desc-preview" id="descText">Loading description...</div>
          <div class="desc-toggle" id="descToggle">Show more</div>
        </div>
      </div>

      <div class="comments-section" id="commentsSection">
        <h2 id="commentsHeading">Comments</h2>
        <div id="commentsList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const VIDEO_ID = new URLSearchParams(window.location.search).get('v') || '';
    if (!VIDEO_ID) {
      window.location.replace('/');
      throw new Error('Missing video id');
    }

    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    const videoKey = `disconnect.videoProgress.${VIDEO_ID}`;
    let player = null;
    let playerReady = false;
    let videoData = null;
    let chapters = [];
    let currentPanel = null;
    let nextCommentsPageToken = null;
    let loadingComments = false;
    let allComments = [];
    let panelCommentLoaded = false;
    let timePoll = null;

    const watchGrid = document.getElementById('watchGrid');
    const watchShell = document.getElementById('watchShell');
    const featurePanel = document.getElementById('featurePanel');
    const panelTitle = document.getElementById('panelTitle');
    const panelBody = document.getElementById('panelBody');
    const placeholder = document.getElementById('playerPlaceholder');
    const saveState = document.getElementById('saveState');
    const resumeBtn = document.getElementById('resumeBtn');
    const resumeLabel = document.getElementById('resumeLabel');
    const topbarStatus = document.getElementById('topbarStatus');

    setTimeout(() => {
      if (playerReady) return;
      placeholder.innerHTML = '<div class="player-message">YouTube player is taking longer than expected to load.</div>';
    }, 8000);

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('youtubePlayer', {
        videoId: VIDEO_ID,
        host: 'https://www.youtube-nocookie.com',
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: 1,
          controls: 1,
          enablejsapi: 1,
          fs: 0,
          iv_load_policy: 3,
          modestbranding: 1,
          playsinline: 1,
          rel: 0,
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onPlaybackRateChange: updateSpeedButtons
        }
      });
    };

    function onPlayerReady() {
      playerReady = true;
      placeholder.classList.add('hidden');
      applyStoredChannelSpeed();
      restoreSavedProgressUI();
      startTimePolling();
    }

    function onPlayerStateChange() {
      updateTopbarStatus();
    }

    function startTimePolling() {
      clearInterval(timePoll);
      timePoll = setInterval(() => {
        updateActiveChapter();
        updateTopbarStatus();
      }, 500);
    }

    function playerTime() {
      if (!playerReady || !player || typeof player.getCurrentTime !== 'function') return 0;
      return player.getCurrentTime() || 0;
    }

    function seekTo(seconds, shouldPlay = true) {
      if (!playerReady || !player) return;
      player.seekTo(seconds, true);
      if (shouldPlay && typeof player.playVideo === 'function') player.playVideo();
      updateActiveChapter(seconds);
    }

    function togglePanel(type) {
      if (currentPanel === type) {
        closePanel();
        return;
      }
      currentPanel = type;
      watchGrid.classList.add('panel-open');
      featurePanel.setAttribute('data-panel', type);
      document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));

      if (type === 'chapters') {
        document.getElementById('chaptersBtn').classList.add('active');
        panelTitle.textContent = 'In this video';
        renderPanelChapters();
      } else if (type === 'comments') {
        document.getElementById('commentsBtn').classList.add('active');
        panelTitle.textContent = document.getElementById('commentsHeading').textContent || 'Comments';
        renderPanelComments();
      } else if (type === 'settings') {
        document.getElementById('settingsBtn').classList.add('active');
        panelTitle.textContent = 'Channel settings';
        renderSettingsPanel();
      }
    }

    function closePanel() {
      currentPanel = null;
      watchGrid.classList.remove('panel-open');
      panelBody.innerHTML = '';
      document.querySelectorAll('.tool-button').forEach(btn => btn.classList.remove('active'));
    }

    document.getElementById('chaptersBtn').addEventListener('click', () => togglePanel('chapters'));
    document.getElementById('commentsBtn').addEventListener('click', () => togglePanel('comments'));
    document.getElementById('settingsBtn').addEventListener('click', () => togglePanel('settings'));
    document.getElementById('closePanelBtn').addEventListener('click', closePanel);

    document.getElementById('fullscreenBtn').addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await watchShell.requestFullscreen();
        }
      } catch (err) {
        showToast('Fullscreen is unavailable in this browser context.');
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreenIcon');
      if (document.fullscreenElement) {
        icon.innerHTML = '<path d="M7 7H5V5h6v2H7v4H5V7h2zm10 0v4h2V5h-6v2h4zm0 10h-4v2h6v-6h-2v4zM7 13H5v6h6v-2H7v-4z"/>';
      } else {
        icon.innerHTML = '<path d="M5 5h6v2H7v4H5V5zm12 2h-4V5h6v6h-2V7zM7 17h4v2H5v-6h2v4zm10-4h2v6h-6v-2h4v-4z"/>';
      }
    });

    document.getElementById('saveBtn').addEventListener('click', saveProgress);
    document.getElementById('finishBtn').addEventListener('click', markFinished);
    resumeBtn.addEventListener('click', () => {
      const saved = getSavedProgress();
      if (!saved?.seconds) return;
      seekTo(saved.seconds, true);
      showToast(`Resumed at ${formatTime(saved.seconds)}.`);
    });

    const descBox = document.getElementById('descBox');
    descBox.addEventListener('click', toggleDescription);
    descBox.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleDescription();
      }
    });

    function toggleDescription() {
      descBox.classList.toggle('expanded');
      const expanded = descBox.classList.contains('expanded');
      document.getElementById('descToggle').textContent = expanded ? 'Show less' : 'Show more';
      descBox.setAttribute('aria-expanded', String(expanded));
    }

    function saveProgress() {
      const seconds = Math.floor(playerTime());
      localStorage.setItem(videoKey, JSON.stringify({ seconds, savedAt: Date.now(), finished: false }));
      restoreSavedProgressUI();
      showToast(`Progress saved at ${formatTime(seconds)}.`);
    }

    function markFinished() {
      localStorage.setItem(videoKey, JSON.stringify({ seconds: Math.floor(playerTime()), savedAt: Date.now(), finished: true }));
      restoreSavedProgressUI();
      showToast('Video marked as finished.');
    }

    function getSavedProgress() {
      try {
        return JSON.parse(localStorage.getItem(videoKey) || 'null');
      } catch {
        return null;
      }
    }

    function restoreSavedProgressUI() {
      const saved = getSavedProgress();
      if (!saved) {
        saveState.textContent = 'No saved progress';
        resumeBtn.hidden = true;
        return;
      }
      if (saved.finished) {
        saveState.textContent = 'Finished';
        resumeBtn.hidden = true;
        return;
      }
      saveState.textContent = `Saved at ${formatTime(saved.seconds || 0)}`;
      resumeLabel.textContent = `Resume ${formatTime(saved.seconds || 0)}`;
      resumeBtn.hidden = false;
    }

    function speedKey() {
      return videoData?.channelId ? `disconnect.channelSpeed.${videoData.channelId}` : null;
    }

    function getStoredChannelSpeed() {
      const key = speedKey();
      if (!key) return null;
      const value = Number(localStorage.getItem(key));
      return Number.isFinite(value) && value > 0 ? value : null;
    }

    function setChannelSpeed(rate) {
      const key = speedKey();
      if (!key) return;
      localStorage.setItem(key, String(rate));
      applyPlaybackRate(rate);
      updateSpeedButtons();
      showToast(`${videoData.channelTitle || 'Channel'} will start at ${rate}x.`);
    }

    function clearChannelSpeed() {
      const key = speedKey();
      if (!key) return;
      localStorage.removeItem(key);
      applyPlaybackRate(1);
      updateSpeedButtons();
      showToast('Channel speed reset to normal.');
    }

    function applyStoredChannelSpeed() {
      const rate = getStoredChannelSpeed();
      if (rate) applyPlaybackRate(rate);
      updateSpeedButtons();
    }

    function applyPlaybackRate(rate) {
      if (!playerReady || !player || typeof player.setPlaybackRate !== 'function') return;
      try {
        player.setPlaybackRate(rate);
      } catch (err) {
        showToast('This video does not support that playback speed.');
      }
    }

    function updateSpeedButtons() {
      const active = getStoredChannelSpeed() || 1;
      document.querySelectorAll('[data-speed]').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.speed) === active);
      });
    }

    async function loadVideoData() {
      try {
        const res = await fetch(`/api/video?id=${encodeURIComponent(VIDEO_ID)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load video');
        videoData = data;

        document.title = `${data.title || 'Video'} - Disconnect`;
        document.getElementById('videoTitle').textContent = data.title || 'Untitled video';
        topbarStatus.textContent = data.channelTitle || 'Ready';

        if (data.channelTitle) {
          document.getElementById('channelRow').style.display = 'flex';
          document.getElementById('channelName').textContent = data.channelTitle;
          if (data.channelAvatar) document.getElementById('channelAvatar').src = data.channelAvatar;
        }

        document.getElementById('descText').innerHTML = linkify(data.description || 'No description available.');

        const count = data.commentCount ? Number(data.commentCount).toLocaleString() : '';
        document.getElementById('commentsHeading').textContent = count ? `Comments (${count})` : 'Comments';

        allComments = data.comments || [];
        if (allComments.length) {
          appendComments(allComments, document.getElementById('commentsList'));
        } else {
          document.getElementById('commentsList').innerHTML = '<div class="empty-state">No comments are available for this video.</div>';
        }

        nextCommentsPageToken = data.nextPageToken || null;
        updateLoadMoreBtn();

        chapters = parseChapters(data.description || '', parseDuration(data.duration || ''));
        renderPanelChapters();
        renderMobileChapters();
        updateChapterButtonState();
        applyStoredChannelSpeed();
      } catch (err) {
        console.error(err);
        document.getElementById('videoTitle').textContent = 'Could not load this video';
        document.getElementById('descText').textContent = err.message || 'The video API request failed.';
        topbarStatus.textContent = 'Video unavailable';
        showToast('Video data could not be loaded.');
      }
    }

    function updateTopbarStatus() {
      if (!videoData) return;
      const current = playerTime();
      const duration = playerReady && player?.getDuration ? player.getDuration() : parseDuration(videoData.duration || '');
      topbarStatus.textContent = duration ? `${formatTime(current)} / ${formatTime(duration)} - ${videoData.channelTitle || ''}` : videoData.channelTitle || 'Ready';
    }

    function updateChapterButtonState() {
      const btn = document.getElementById('chaptersBtn');
      btn.disabled = !chapters.length;
      btn.style.opacity = chapters.length ? '' : '0.56';
      btn.title = chapters.length ? 'Open chapters' : 'No chapters found';
    }

    function appendComments(comments, container) {
      comments.forEach(c => {
        const thread = document.createElement('div');
        thread.className = container.id === 'panelBody' ? 'comment-thread panel-thread' : 'comment-thread';
        let html = `<div class="comment-main">
          <img src="${escAttr(c.avatar || '')}" alt="" />
          <div class="comment-body">
            <div class="author">${escHtml(c.author || 'Unknown')}</div>
            <div class="text truncated">${c.text || ''}</div>
            <div class="meta">
              <span>${c.likes ? `${Number(c.likes).toLocaleString()} likes` : ''}</span>
              <span>${timeAgo(c.date)}</span>
            </div>
          </div>
        </div>`;

        if (c.replyCount > 0) {
          html += '<div class="thread-stem"></div>';
          html += `<button class="replies-toggle-top" data-comment-id="${escAttr(c.id)}">Show ${c.replyCount} ${c.replyCount === 1 ? 'reply' : 'replies'}</button>`;
          html += `<div class="replies-container" id="replies-${escAttr(c.id)}"></div>`;
        }

        thread.innerHTML = html;
        container.appendChild(thread);

        addReadMore(thread.querySelector('.comment-main .text'));

        if (c.replyCount > 0) wireReplyThread(thread, c);
      });
    }

    function wireReplyThread(thread, c) {
      const topToggle = thread.querySelector('.replies-toggle-top');
      const repliesContainer = thread.querySelector('.replies-container');
      const threadStem = thread.querySelector('.thread-stem');
      thread.classList.add('has-replies');

      const bottomToggle = document.createElement('button');
      bottomToggle.className = 'replies-toggle-bottom';
      bottomToggle.dataset.commentId = c.id;
      bottomToggle.textContent = 'Hide replies';
      bottomToggle.style.display = 'none';
      repliesContainer.appendChild(bottomToggle);

      const hoverOn = () => thread.classList.add('thread-hover');
      const hoverOff = () => thread.classList.remove('thread-hover');
      threadStem.addEventListener('mouseenter', hoverOn);
      threadStem.addEventListener('mouseleave', hoverOff);

      const updateStemHeight = () => {
        requestAnimationFrame(() => {
          const target = repliesContainer.classList.contains('show') ? repliesContainer : topToggle;
          const threadRect = thread.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const stemCSSTop = parseFloat(getComputedStyle(threadStem).top);
          threadStem.style.height = Math.max(0, targetRect.top - threadRect.top - stemCSSTop + 2) + 'px';
        });
      };

      const collapseReplies = () => {
        repliesContainer.classList.remove('show');
        thread.classList.remove('has-replies-open');
        topToggle.textContent = `Show ${c.replyCount} ${c.replyCount === 1 ? 'reply' : 'replies'}`;
        topToggle.style.display = '';
        bottomToggle.style.display = 'none';
        updateStemHeight();
      };

      const expandReplies = async () => {
        repliesContainer.classList.add('show');
        thread.classList.add('has-replies-open');
        topToggle.style.display = 'none';
        bottomToggle.style.display = '';

        if (!repliesContainer.querySelector('.reply-wrapper')) {
          topToggle.style.display = '';
          topToggle.disabled = true;
          topToggle.textContent = 'Loading...';
          bottomToggle.style.display = 'none';
          try {
            const res = await fetch(`/api/video?id=${encodeURIComponent(VIDEO_ID)}&replies=${encodeURIComponent(c.id)}`);
            const data = await res.json();
            if (data.replies?.length) buildReplyTree(data.replies, c.author, repliesContainer, collapseReplies);
          } catch (err) {
            console.error('Failed to load replies:', err);
            showToast('Replies could not be loaded.');
          }
          topToggle.disabled = false;
          topToggle.style.display = 'none';
          bottomToggle.style.display = '';
        }
        updateStemHeight();
      };

      threadStem.addEventListener('click', () => {
        if (repliesContainer.classList.contains('show')) collapseReplies();
        else expandReplies();
      });
      topToggle.addEventListener('click', expandReplies);
      bottomToggle.addEventListener('click', collapseReplies);
      requestAnimationFrame(updateStemHeight);
    }

    function addReadMore(textEl) {
      if (!textEl) return;
      requestAnimationFrame(() => {
        if (textEl.scrollHeight <= textEl.clientHeight + 2) return;
        const btn = document.createElement('button');
        btn.className = 'read-more-btn';
        btn.textContent = 'Read more';
        btn.addEventListener('click', () => {
          const expanded = textEl.classList.toggle('expanded');
          btn.textContent = expanded ? 'Show less' : 'Read more';
          recalcStemHeights(textEl);
        });
        textEl.parentNode.insertBefore(btn, textEl.nextSibling);
      });
    }

    function recalcStemHeights(el) {
      const thread = el.closest('.comment-thread');
      if (!thread) return;
      requestAnimationFrame(() => {
        const threadStem = thread.querySelector(':scope > .thread-stem');
        if (threadStem && threadStem.style.height) {
          const repliesContainer = thread.querySelector(':scope > .replies-container');
          const topToggle = thread.querySelector(':scope > .replies-toggle-top');
          const target = repliesContainer && repliesContainer.classList.contains('show') ? repliesContainer : topToggle;
          if (target) {
            const threadRect = thread.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            const stemCSSTop = parseFloat(getComputedStyle(threadStem).top);
            threadStem.style.height = Math.max(0, targetRect.top - threadRect.top - stemCSSTop + 2) + 'px';
          }
        }
        thread.querySelectorAll('.reply-wrapper').forEach(wrapper => {
          const subStem = wrapper.querySelector(':scope > .subreply-stem');
          if (!subStem || !subStem.style.height) return;
          const subContainer = wrapper.querySelector(':scope > .subreplies-container');
          const subToggleTop = wrapper.querySelector(':scope > .subreply-toggle');
          const target = subContainer && subContainer.classList.contains('show') ? subContainer : subToggleTop;
          if (target) {
            const wrapperRect = wrapper.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            const stemCSSTop = parseFloat(getComputedStyle(subStem).top);
            subStem.style.height = Math.max(0, targetRect.top - wrapperRect.top - stemCSSTop + 2) + 'px';
          }
        });
      });
    }

    function buildReplyTree(replies, parentAuthor, container, collapseParent) {
      const collapseLine = document.createElement('div');
      collapseLine.className = 'replies-collapse-line';
      collapseLine.addEventListener('click', collapseParent);
      const parentThread = container.closest('.comment-thread');
      if (parentThread) {
        collapseLine.addEventListener('mouseenter', () => parentThread.classList.add('thread-hover'));
        collapseLine.addEventListener('mouseleave', () => parentThread.classList.remove('thread-hover'));
      }
      container.appendChild(collapseLine);

      const norm = s => String(s || '').toLowerCase().replace(/^@/, '').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
      const parsed = replies.map(r => {
        const orig = (r.textOriginal || '').replace(/^[\u200B-\u200D\uFEFF]+/, '');
        let mentionedHandle = null;
        let cleanText = r.text || '';
        const m = orig.match(/^@(\S+)\s+/);
        if (m) {
          mentionedHandle = m[1];
          cleanText = cleanText
            .replace(/^[\u200B-\u200D\uFEFF]*/, '')
            .replace(/^<a[^>]*>@[^<]*<\/a>\s*/, '')
            .replace(/^@\S+\s*/, '');
        }
        return { ...r, mentionedHandle, cleanText };
      });

      const handleMatches = (handle, author) => norm(handle) === norm(author);
      const directReplies = [];
      const pendingSubs = [];

      parsed.forEach(r => {
        if (!r.mentionedHandle || handleMatches(r.mentionedHandle, parentAuthor)) directReplies.push(r);
        else pendingSubs.push(r);
      });

      const subRepliesByIdx = {};
      pendingSubs.forEach(r => {
        let targetIdx = -1;
        for (let i = directReplies.length - 1; i >= 0; i--) {
          if (handleMatches(r.mentionedHandle, directReplies[i].author)) {
            targetIdx = i;
            break;
          }
        }
        if (targetIdx >= 0) {
          if (!subRepliesByIdx[targetIdx]) subRepliesByIdx[targetIdx] = [];
          subRepliesByIdx[targetIdx].push(r);
        } else {
          directReplies.push(r);
        }
      });

      directReplies.forEach((r, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'reply-wrapper';
        const subs = subRepliesByIdx[idx] || [];

        const el = document.createElement('div');
        el.className = 'comment-main';
        el.innerHTML = `<img src="${escAttr(r.avatar || '')}" alt="" /><div class="comment-body"><div class="author">${escHtml(r.author || 'Unknown')}</div><div class="text truncated">${r.cleanText}</div><div class="meta"><span>${r.likes ? `${Number(r.likes).toLocaleString()} likes` : ''}</span><span>${timeAgo(r.date)}</span></div></div>`;
        wrapper.appendChild(el);
        addReadMore(el.querySelector('.text'));

        if (subs.length > 0) {
          const subStem = document.createElement('div');
          subStem.className = 'subreply-stem';
          wrapper.appendChild(subStem);
          wrapper.classList.add('has-subreplies');

          const subToggleTop = document.createElement('button');
          subToggleTop.className = 'subreply-toggle';
          subToggleTop.textContent = subs.length === 1 ? 'Show reply' : `Show ${subs.length} replies`;

          const subContainer = document.createElement('div');
          subContainer.className = 'subreplies-container';

          const subCollapseLine = document.createElement('div');
          subCollapseLine.className = 'subreplies-collapse-line';

          const subToggleBottom = document.createElement('button');
          subToggleBottom.className = 'subreply-toggle-bottom';
          subToggleBottom.style.display = 'none';
          subToggleBottom.textContent = subs.length === 1 ? 'Hide reply' : 'Hide replies';

          const updateSubStemHeight = () => {
            requestAnimationFrame(() => {
              const target = subContainer.classList.contains('show') ? subContainer : subToggleTop;
              const wrapperRect = wrapper.getBoundingClientRect();
              const targetRect = target.getBoundingClientRect();
              const stemCSSTop = parseFloat(getComputedStyle(subStem).top);
              subStem.style.height = Math.max(0, targetRect.top - wrapperRect.top - stemCSSTop + 2) + 'px';
            });
          };

          const showSubs = () => {
            subContainer.classList.add('show');
            wrapper.classList.add('has-subreplies-open');
            subToggleTop.style.display = 'none';
            subToggleBottom.style.display = '';
            updateSubStemHeight();
          };

          const hideSubs = () => {
            subContainer.classList.remove('show');
            wrapper.classList.remove('has-subreplies-open');
            subToggleTop.style.display = '';
            subToggleTop.textContent = subs.length === 1 ? 'Show reply' : `Show ${subs.length} replies`;
            subToggleBottom.style.display = 'none';
            updateSubStemHeight();
          };

          const subHoverOn = () => wrapper.classList.add('subreply-hover');
          const subHoverOff = () => wrapper.classList.remove('subreply-hover');
          subStem.addEventListener('mouseenter', subHoverOn);
          subStem.addEventListener('mouseleave', subHoverOff);
          subCollapseLine.addEventListener('mouseenter', subHoverOn);
          subCollapseLine.addEventListener('mouseleave', subHoverOff);
          subCollapseLine.addEventListener('click', hideSubs);
          subStem.addEventListener('click', () => {
            if (subContainer.classList.contains('show')) hideSubs();
            else showSubs();
          });

          subContainer.appendChild(subCollapseLine);
          subs.forEach(sr => {
            const subItem = document.createElement('div');
            subItem.className = 'subreply-item';
            const subEl = document.createElement('div');
            subEl.className = 'comment-main';
            subEl.innerHTML = `<img src="${escAttr(sr.avatar || '')}" alt="" /><div class="comment-body"><div class="author">${escHtml(sr.author || 'Unknown')}</div><div class="text truncated">${sr.cleanText}</div><div class="meta"><span>${sr.likes ? `${Number(sr.likes).toLocaleString()} likes` : ''}</span><span>${timeAgo(sr.date)}</span></div></div>`;
            subItem.appendChild(subEl);
            subContainer.appendChild(subItem);
            addReadMore(subEl.querySelector('.text'));
          });

          subContainer.appendChild(subToggleBottom);
          subToggleTop.addEventListener('click', showSubs);
          subToggleBottom.addEventListener('click', hideSubs);
          wrapper.appendChild(subToggleTop);
          wrapper.appendChild(subContainer);
          requestAnimationFrame(updateSubStemHeight);
        }

        container.appendChild(wrapper);
      });

      const bottomToggle = container.querySelector('.replies-toggle-bottom');
      if (bottomToggle) container.appendChild(bottomToggle);
    }

    function renderPanelChapters() {
      if (currentPanel !== 'chapters' && panelBody.childElementCount) return;
      panelBody.innerHTML = '';
      if (!chapters.length) {
        panelBody.innerHTML = '<div class="empty-state">No valid YouTube-style chapters were found in this description.</div>';
        return;
      }
      const thumb = `https://i.ytimg.com/vi/${VIDEO_ID}/mqdefault.jpg`;
      chapters.forEach(ch => {
        const item = document.createElement('button');
        item.className = 'chapter-item';
        item.type = 'button';
        item.dataset.start = ch.seconds;
        item.dataset.end = ch.end;
        item.innerHTML = `<img class="chapter-thumb" src="${thumb}" alt="" /><span><span class="chapter-label">${escHtml(ch.label)}</span><span class="chapter-time">${ch.time}</span></span>`;
        item.addEventListener('click', () => seekTo(ch.seconds, true));
        panelBody.appendChild(item);
      });
      updateActiveChapter();
    }

    function renderMobileChapters() {
      const strip = document.getElementById('mobileChapterStrip');
      strip.innerHTML = '';
      strip.classList.toggle('has-chapters', chapters.length > 0);
      if (!chapters.length) return;
      const thumb = `https://i.ytimg.com/vi/${VIDEO_ID}/mqdefault.jpg`;
      chapters.forEach(ch => {
        const chip = document.createElement('button');
        chip.className = 'chapter-chip';
        chip.type = 'button';
        chip.dataset.start = ch.seconds;
        chip.dataset.end = ch.end;
        chip.innerHTML = `<img src="${thumb}" alt="" /><span>${escHtml(ch.label)}</span><small>${ch.time}</small>`;
        chip.addEventListener('click', () => seekTo(ch.seconds, true));
        strip.appendChild(chip);
      });
    }

    function updateActiveChapter(forcedTime) {
      if (!chapters.length) return;
      const time = Number.isFinite(forcedTime) ? forcedTime : playerTime();
      document.querySelectorAll('.chapter-item, .chapter-chip').forEach(item => {
        const start = Number(item.dataset.start);
        const end = Number(item.dataset.end);
        const active = time >= start && time < end;
        const wasActive = item.classList.contains('active');
        item.classList.toggle('active', active);
        if (active && !wasActive && item.classList.contains('chapter-chip')) {
          item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      });
    }

    function renderPanelComments() {
      panelBody.innerHTML = '';
      panelCommentLoaded = true;
      if (!allComments.length) {
        panelBody.innerHTML = '<div class="empty-state">No comments are available for this video.</div>';
        return;
      }
      appendComments(allComments, panelBody);
    }

    function renderSettingsPanel() {
      const storedSpeed = getStoredChannelSpeed();
      const currentRate = storedSpeed || 1;
      panelBody.innerHTML = `
        <div class="settings-panel">
          <div class="settings-block">
            <div class="settings-label">Channel</div>
            <div class="channel-mini">
              <img src="${escAttr(videoData?.channelAvatar || '')}" alt="" />
              <div>
                <strong>${escHtml(videoData?.channelTitle || 'Unknown channel')}</strong>
                <span>${storedSpeed ? `Default speed ${storedSpeed}x` : 'Using normal speed'}</span>
              </div>
            </div>
          </div>
          <div class="settings-block">
            <div class="settings-label">Playback speed for this channel</div>
            <div class="speed-grid">
              ${SPEEDS.map(speed => `<button class="speed-button ${speed === currentRate ? 'active' : ''}" type="button" data-speed="${speed}">${speed}x</button>`).join('')}
            </div>
            <p class="settings-note">This uses the official YouTube IFrame API playback-rate control and saves the preference locally for this channel.</p>
            <button class="speed-button clear-speed" type="button" id="clearSpeedBtn">Clear channel default</button>
          </div>
        </div>
      `;

      panelBody.querySelectorAll('[data-speed]').forEach(btn => {
        btn.addEventListener('click', () => setChannelSpeed(Number(btn.dataset.speed)));
      });
      panelBody.querySelector('#clearSpeedBtn')?.addEventListener('click', clearChannelSpeed);
      updateSpeedButtons();
    }

    function updateLoadMoreBtn() {
      let btn = document.getElementById('loadMoreBtn');
      if (nextCommentsPageToken) {
        if (!btn) {
          btn = document.createElement('button');
          btn.id = 'loadMoreBtn';
          btn.className = 'load-more-btn';
          btn.textContent = 'Load more comments';
          btn.addEventListener('click', loadMoreComments);
          document.getElementById('commentsList').after(btn);
        }
        btn.style.display = 'block';
      } else if (btn) {
        btn.style.display = 'none';
      }
    }

    async function loadMoreComments() {
      if (loadingComments || !nextCommentsPageToken) return;
      loadingComments = true;
      const btn = document.getElementById('loadMoreBtn');
      if (btn) {
        btn.textContent = 'Loading...';
        btn.disabled = true;
      }
      try {
        const res = await fetch(`/api/video?id=${encodeURIComponent(VIDEO_ID)}&commentsPage=${encodeURIComponent(nextCommentsPageToken)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load comments');
        if (data.comments?.length) {
          allComments.push(...data.comments);
          appendComments(data.comments, document.getElementById('commentsList'));
          if (currentPanel === 'comments' && panelCommentLoaded) renderPanelComments();
        }
        nextCommentsPageToken = data.nextPageToken || null;
        updateLoadMoreBtn();
      } catch (err) {
        console.error(err);
        showToast('More comments could not be loaded.');
      } finally {
        loadingComments = false;
        if (btn) {
          btn.textContent = 'Load more comments';
          btn.disabled = false;
        }
      }
    }

    window.addEventListener('scroll', () => {
      if (loadingComments || !nextCommentsPageToken) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 460) loadMoreComments();
    });

    function parseChapters(desc, totalDuration) {
      const regex = /^[\s]*(\d{1,2}:\d{2}(?::\d{2})?)\s*(?:[-.)\]]\s*)*(.+)$/gm;
      const parsed = [];
      let match;
      while ((match = regex.exec(desc)) !== null) {
        parsed.push({ time: match[1].trim(), label: match[2].trim(), seconds: timeToSeconds(match[1].trim()) });
      }
      if (parsed.length < 3 || parsed[0].seconds !== 0) return [];
      parsed.sort((a, b) => a.seconds - b.seconds);
      for (let i = 0; i < parsed.length; i++) {
        parsed[i].end = i < parsed.length - 1 ? parsed[i + 1].seconds : totalDuration || parsed[i].seconds + 1;
      }
      return parsed;
    }

    function linkify(text) {
      return escHtml(text)
        .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\n/g, '<br>');
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = String(s ?? '');
      return d.innerHTML;
    }

    function escAttr(s) {
      return escHtml(s).replace(/'/g, '&#39;');
    }

    function timeToSeconds(t) {
      const p = t.split(':').map(Number);
      return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
    }

    function parseDuration(iso) {
      const m = String(iso || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      return m ? (parseInt(m[1] || 0) * 3600) + (parseInt(m[2] || 0) * 60) + parseInt(m[3] || 0) : 0;
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(safe / 3600);
      const m = Math.floor((safe % 3600) / 60);
      const s = safe % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }

    function timeAgo(dateStr) {
      const time = new Date(dateStr).getTime();
      if (!Number.isFinite(time)) return '';
      const diff = Date.now() - time;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}d ago`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months}mo ago`;
      return `${Math.floor(months / 12)}y ago`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.textContent = message;
      toast.appendChild(item);
      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(4px)';
        item.style.transition = 'opacity 0.2s, transform 0.2s';
      }, 2400);
      setTimeout(() => item.remove(), 2700);
    }

    loadVideoData();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
